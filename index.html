<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Gaussian Floater – Edytor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">GF</span>
      <span class="title">Gaussian Floater</span>
    </div>
    <div class="actions">
      <button id="loadImageBtn">Wczytaj obraz</button>
      <button id="saveProcessedBtn">Zapisz przetworzony obraz</button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <section class="panel">
        <h2>Filtry</h2>

        <div class="control-group">
          <label for="blurAmount">Siła blurra (Gaussian)</label>
          <input type="range" id="blurAmount" min="0" max="0.2" step="0.001" value="0.03" />
        </div>

        <div class="control-group">
          <label for="glowStrength">Siła glow</label>
          <input type="range" id="glowStrength" min="0" max="3" step="0.01" value="1.2" />
        </div>

        <div class="control-group">
          <label for="colorR">Kolor – R</label>
          <input type="range" id="colorR" min="0" max="1" step="0.01" value="0.2" />
        </div>
        <div class="control-group">
          <label for="colorG">Kolor – G</label>
          <input type="range" id="colorG" min="0" max="1" step="0.01" value="0.6" />
        </div>
        <div class="control-group">
          <label for="colorB">Kolor – B</label>
          <input type="range" id="colorB" min="0" max="1" step="0.01" value="1.0" />
        </div>

        <div class="control-group">
          <label for="layersCount">Liczba warstw glow</label>
          <input type="range" id="layersCount" min="1" max="5" step="1" value="3" />
        </div>

        <div class="control-group">
          <label for="breatheEnabled">„Oddychanie” blurra</label>
          <input type="checkbox" id="breatheEnabled" checked />
        </div>

        <p class="hint">
          Wczytaj obraz, dostosuj parametry i zapisz wynik na dysku.
          Renderowanie odbywa się w oryginalnej rozdzielczości obrazu.
        </p>
      </section>

      <section class="panel">
        <h2>Informacje</h2>
        <p class="hint">
          Przetwarzanie odbywa się lokalnie w przeglądarce. Żaden obraz nie jest wysyłany na serwer.
        </p>
      </section>
    </aside>

    <main class="main">
      <canvas id="glcanvas"></canvas>
    </main>
  </div>

  <input type="file" id="imageFileInput" accept="image/*" style="display:none" />
  <script type="module" src="main.js"></script>
</body>
</html>
